<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Andrea Maillard : un parcours du sport et du marketing à l’UX et au produit.">
<title>Andrea's Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Hanken+Grotesk:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout concept: one vertical route (a triathlon course) with a stage per chapter, an avatar that walks it as you scroll, and a to-scale ruler on top. Three lanes: sport and learning (ink), business and marketing (coral), product and UX (blue). */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0E1630; --ink-2:#414A66; --muted:#6B7390; --line:#DDE2EE;
  --c0:#0E1630; --c1:#FF5B49; --c2:#3D4DF5; --c1-ink:#B8321F; --c2-ink:#2B38D4;
  --on0:#FFFFFF; --on1:#0E1630; --on2:#FFFFFF;
  --skin:#E9B994; --hair:#1B1A2E;
  --shadow:0 1px 2px rgba(14,22,48,.06),0 8px 24px rgba(14,22,48,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1022; --surface:#131B33; --ink:#F2F4FB; --ink-2:#B7BED6; --muted:#8C94B2; --line:#26304F;
    --c0:#C9D0E8; --c1:#FF7A6B; --c2:#8E99FF; --c1-ink:#FF9A8D; --c2-ink:#A9B2FF;
    --on0:#0A1022; --on1:#0A1022; --on2:#0A1022; --hair:#0B0B16;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1022; --surface:#131B33; --ink:#F2F4FB; --ink-2:#B7BED6; --muted:#8C94B2; --line:#26304F;
  --c0:#C9D0E8; --c1:#FF7A6B; --c2:#8E99FF; --c1-ink:#FF9A8D; --c2-ink:#A9B2FF;
  --on0:#0A1022; --on1:#0A1022; --on2:#0A1022; --hair:#0B0B16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin-inline:auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:-.01em;white-space:nowrap;text-decoration:none;color:inherit}
.brand svg{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.sp{flex:1}
.seg{display:flex;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn svg{width:18px;height:18px}
@media (max-width:520px){.brand span{display:none}}

.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:center;padding-block:56px 24px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);padding-block:36px 24px}}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c2-ink)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,76px);line-height:.98;letter-spacing:-.035em;margin:14px 0 18px;text-wrap:balance}
h1 em{font-style:normal;position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-.06em;height:.16em;background:var(--c1);border-radius:99px;transform:rotate(-1.2deg)}
.lede{font-size:clamp(17px,2.2vw,20px);color:var(--ink-2);max-width:48ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.hlinks{display:flex;gap:6px}
.hl{font-weight:600;font-size:13px;line-height:1;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.hl:hover{color:var(--ink);border-color:var(--ink-2)}
.hl .s{display:none}
@media (max-width:520px){.hl{padding:8px 10px}.hl .l{display:none}.hl .s{display:inline}}
.hero svg.art{width:100%;height:auto;max-width:520px;justify-self:center}
.hand{font-family:var(--hand);font-weight:600}

section{padding-block:56px 8px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.note{color:var(--ink-2);margin-top:8px;max-width:60ch}
.head{margin-bottom:24px}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px}
.ruler{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 18px 40px;box-shadow:var(--shadow)}
.axis{position:relative;height:22px;margin-bottom:6px}
.axis span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.tracks{position:relative}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.lane{position:relative;margin-bottom:12px}
.bar{position:absolute;height:26px;border:0;border-radius:7px;padding:0 8px;font:600 11.5px/26px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer}
.bar[data-lane="0"]{background:var(--c0);color:var(--on0)}
.bar[data-lane="1"]{background:var(--c1);color:var(--on1)}
.bar[data-lane="2"]{background:var(--c2);color:var(--on2)}
.bar:hover,.bar:focus-visible{filter:brightness(1.12);outline-offset:1px}
.tt{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 12px 32px rgba(0,0,0,.28);pointer-events:none;font-size:14px;line-height:1.45}
.tt[hidden]{display:none}
.tt b{display:block;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;margin-bottom:2px}
.tt .tr{opacity:.85}
.tt .ty{font-size:12px;font-weight:600;letter-spacing:.04em;opacity:.7;margin-top:2px;font-variant-numeric:tabular-nums}
.tt ul{margin:8px 0 0;padding-left:16px;list-style:disc;display:grid;gap:3px}
.tt li{padding-left:0}
.blabel{position:absolute;height:26px;font:600 11.5px/26px var(--body);color:var(--ink-2);white-space:nowrap;pointer-events:none}
.dia{position:absolute;width:13px;height:13px;border:0;padding:0;background:var(--c0);transform:rotate(45deg);border-radius:2px;cursor:help}
.tm{position:absolute;top:-8px;bottom:-6px;border-left:2px dashed var(--muted);pointer-events:none}
.tm b{position:absolute;bottom:-30px;left:6px;font-family:var(--hand);font-size:20px;font-weight:600;color:var(--ink);white-space:nowrap}
.tm.r b{left:auto;right:6px}
.tmnote{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px;font-size:14px;color:var(--ink-2)}
.tmnote .hand{font-size:20px;color:var(--ink)}

.route{position:relative;margin-top:8px}
.rsvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.rsvg.back{z-index:0}.rsvg.front{z-index:3}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);align-items:start;margin-bottom:30px;z-index:1}
.stage[data-lane="0"]{--lane:var(--c0);--lane-ink:var(--c0);--on:var(--on0)}
.stage[data-lane="1"]{--lane:var(--c1);--lane-ink:var(--c1-ink);--on:var(--on1)}
.stage[data-lane="2"]{--lane:var(--c2);--lane-ink:var(--c2-ink);--on:var(--on2)}
.node{grid-column:2;grid-row:1;justify-self:center;width:64px;height:64px;border-radius:50%;background:var(--surface);border:3px solid var(--lane);color:var(--lane-ink);display:grid;place-items:center;position:relative;z-index:2}
.node svg{width:36px;height:36px}
.stage.done .node{background:var(--lane);color:var(--on)}
.stage:nth-of-type(odd) .node{transform:translateX(18px)}
.stage:nth-of-type(even) .node{transform:translateX(-18px)}
.card{grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.stage:nth-of-type(odd) .card{grid-column:1}
.stage:nth-of-type(even) .card{grid-column:3}
.card{position:relative}
.tog{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.tog:hover{border-color:var(--ink-2);color:var(--ink)}
.tog svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg)}
.card.closed .tog svg{transform:none}
.card.closed .det{display:none}
.card .yrs,.card h3{padding-right:38px}
.yrs{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--lane-ink);font-variant-numeric:tabular-nums}
.card h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;line-height:1.15;margin:4px 0 2px}
.role{color:var(--ink-2);font-weight:500}
.card ul{margin-top:10px;display:grid;gap:6px;font-size:15px;color:var(--ink-2)}
.card li{padding-left:16px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--lane)}
.stage.next .card{border-style:dashed;background:transparent;box-shadow:none}
.stage.flash .card{outline:3px solid var(--lane);outline-offset:2px}
.zone{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);margin:-10px 0 24px;position:relative;z-index:1}
.zone span{grid-column:1/-1;justify-self:center;font-family:var(--hand);font-weight:600;font-size:21px;padding:2px 18px;border:2px dashed var(--muted);border-radius:999px;background:var(--bg);color:var(--ink);text-align:center}
@media (max-width:720px){
  .stage,.zone{grid-template-columns:48px minmax(0,1fr);column-gap:14px}
  .node{grid-column:1;width:48px;height:48px;border-width:2px}
  .node svg{width:26px;height:26px}
  .stage:nth-of-type(odd) .node,.stage:nth-of-type(even) .node{transform:none}
  .stage:nth-of-type(odd) .card,.stage:nth-of-type(even) .card{grid-column:2}
  .zone span{grid-column:2;justify-self:start;font-size:19px}
  .card{padding:16px}
}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.stat b{font-family:var(--display);font-weight:800;font-size:clamp(44px,6vw,60px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2)}
.stat em{font-style:normal;font-size:13px;font-weight:600;color:var(--lane-ink);display:flex;align-items:center;gap:8px;margin-top:4px}
.stat em i{width:9px;height:9px;border-radius:50%;background:var(--lane)}
.stat[data-lane="0"]{--lane:var(--c0);--lane-ink:var(--c0)}
.stat[data-lane="1"]{--lane:var(--c1);--lane-ink:var(--c1-ink)}
.stat[data-lane="2"]{--lane:var(--c2);--lane-ink:var(--c2-ink)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:860px;table-layout:fixed}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:11px;line-height:1.2;vertical-align:top;padding:12px 4px 10px}
th svg{width:24px;height:24px;display:block;margin:0 auto 6px}
th span{display:block;height:2.4em;overflow-wrap:anywhere}
th:first-child,td:first-child{text-align:left;padding-left:16px;font-weight:600;width:190px;font-size:12.5px}
td i{display:inline-block;width:14px;height:14px;border-radius:50%}
tbody tr:hover td{background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.dl0{background:var(--c0)}.dl1{background:var(--c1)}.dl2{background:var(--c2)}

.next-card{display:flex;flex-wrap:wrap;align-items:center;gap:20px;background:var(--ink);color:var(--bg);border-radius:20px;padding:28px}
.next-card svg{width:64px;height:64px;flex:none}
.next-card h2{color:var(--bg)}
.next-card p{color:color-mix(in srgb,var(--bg) 80%,var(--ink));margin-top:6px;max-width:52ch}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
</style>
</head>
<body>

  for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],m=(a.y+b.y)/2;d+=' C'+a.x+' '+m+' '+b.x+' '+m+' '+b.x+' '+b.y}
  back.innerHTML='<path id="trk" d="'+d+'" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 12"/><path id="prg" d="'+d+'" fill="none" stroke="var(--c1)" stroke-width="6" stroke-linecap="round"/>';
  front.innerHTML='<g id="walker"><circle r="25" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><use href="#avatar" x="-23.5" y="-23.5" width="47" height="47"/></g>';
  pathEl=$('#trk');L=pathEl.getTotalLength();walker=$('#walker');
  $('#prg').style.strokeDasharray=L+' '+L;
  update();
}
function update(){
  ticking=false;if(!pathEl)return;
  var box=$('#routebox'),r=box.getBoundingClientRect();
  var first=pts[0].y,last=pts[pts.length-1].y;
  var anchor=window.innerHeight*0.55-r.top;
  var p=Math.max(0,Math.min(1,(anchor-first)/(last-first)));
  var len=p*L,pt=pathEl.getPointAtLength(len);
  walker.setAttribute('transform','translate('+pt.x+' '+pt.y+')');
  $('#prg').style.strokeDashoffset=L-len;
  var st=document.querySelectorAll('.stage');
  for(var i=0;i<st.length;i++)st[i].classList.toggle('done',pts[i]&&pts[i].y<=pt.y+2);
}
function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
function goTo(id){
  var el=document.getElementById('s-'+id);if(!el)return;
  var cc=el.querySelector('.card.closed');if(cc){cc.classList.remove('closed');var tb=cc.querySelector('.tog');if(tb)tb.setAttribute('aria-expanded','true');layoutRoute();}
  el.scrollIntoView({block:'center'});
  el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},1600);
}

function showTip(el){
  var tt=$('#tt');if(!tt)return;
  var id=el.getAttribute('data-go'),h='';
  var S=id?byId(id):null;
  if(S){
    var T=S[lang],ttl=S.tip?S.tip[lang]:(S.tipR||!S.noswap?T.r:T.n),sub=S.noswap?T.r:T.n;
    var yrs=lang==='fr'?S.yesFR:lang==='de'?S.yesDE:S.yrs;
    if(S.tip||S.tipR)yrs=yrs.split(' \u00b7 ')[0];
    h='<b>'+ttl+'</b>';
    if(!S.tip&&!S.tipR&&sub)h+='<span class="tr">'+sub+'</span>';
    h+='<div class="ty">'+yrs+'</div>';
    if(T.b&&T.b.length)h+='<ul>'+T.b.map(function(b){return '<li>'+b+'</li>'}).join('')+'</ul>';
  }else{h='<b>'+(el.getAttribute('aria-label')||'')+'</b>';}
  tt.innerHTML=h;tt.hidden=false;
  var r=el.getBoundingClientRect(),w=tt.offsetWidth,hh=tt.offsetHeight;
  var x=Math.max(12,Math.min(r.left,window.innerWidth-w-12));
  var y=r.bottom+10;if(y+hh>window.innerHeight-12)y=Math.max(12,r.top-hh-10);
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTip(){var tt=$('#tt');if(tt)tt.hidden=true}
document.addEventListener('mouseover',function(e){var el=e.target.closest('.bar,.dia');if(el)showTip(el)});
document.addEventListener('mouseout',function(e){if(e.target.closest('.bar,.dia'))hideTip()});
document.addEventListener('focusin',function(e){var el=e.target.closest&&e.target.closest('.bar,.dia');if(el)showTip(el)});
document.addEventListener('focusout',function(e){if(e.target.closest&&e.target.closest('.bar,.dia'))hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});
function applyTheme(){
  var root=document.documentElement;
  if(themeMode==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',themeMode);
}
function renderAll(){renderText();renderRuler();renderStages();renderImpact();renderMatrix();requestAnimationFrame(layoutRoute)}
document.addEventListener('click',function(e){
  var tg=e.target.closest('.tog');if(tg){var cd=tg.closest('.card');var cl=cd.classList.toggle('closed');tg.setAttribute('aria-expanded',cl?'false':'true');requestAnimationFrame(layoutRoute);return}
  var t=e.target.closest('[data-go]');if(t){goTo(t.getAttribute('data-go'));return}
  var lb=e.target.closest('[data-lang]');if(lb){lang=lb.getAttribute('data-lang');renderAll();return}
  if(e.target.closest('#theme')){themeMode=themeMode==='auto'?'dark':themeMode==='dark'?'light':'auto';try{localStorage.setItem('route-theme',themeMode)}catch(x){}applyTheme();}
});
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){requestAnimationFrame(layoutRoute)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){requestAnimationFrame(layoutRoute)});
applyTheme();renderAll();
})();
</script>

</body>
</html>
